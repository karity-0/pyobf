[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyobf"
version = "0.1.0"
description = "A GUI-first Python source obfuscator foundation"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]

[tool.setuptools.packages.find]
include = ["pyobf*"]
